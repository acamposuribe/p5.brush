<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pastel Hatching — Standalone</title>
    <style>
      :root {
        --paper: #f3eee2;
        --ink: #22313f;
        --muted: #52616e;
        --line: #d4c8b8;
        --panel: rgba(255, 252, 245, 0.86);
        --accent: #153e5c;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(21, 62, 92, 0.08), transparent 24%),
          linear-gradient(180deg, #f7f2e7 0%, #ece3d3 100%);
        font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, serif;
      }

      main {
        width: min(920px, calc(100vw - 24px));
        margin: 0 auto;
        padding: 18px 0 24px;
        display: grid;
        justify-items: center;
      }

      main > * { width: 100%; }

      .nav {
        margin-bottom: 14px;
        font: 11px/1.2 Menlo, Monaco, "Courier New", monospace;
        display: flex;
        gap: 12px;
      }

      .nav a { color: var(--accent); text-decoration: none; }
      .nav a:hover { text-decoration: underline; }
      .nav .sep { color: #8a9aa8; }

      h1 { margin: 0 0 8px; font-size: clamp(24px, 3.6vw, 34px); letter-spacing: -0.04em; }

      p { margin: 0 0 8px; max-width: 760px; color: var(--muted); line-height: 1.45; font-size: 13px; }

      .workspace {
        margin-top: 18px;
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr);
        gap: 18px;
        align-items: start;
      }

      .panel { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }

      #controls {
        padding: 14px 16px;
        display: grid;
        gap: 12px;
        align-self: start;
      }

      .top-row {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: space-between;
        font: 11px/1.4 Menlo, Monaco, "Courier New", monospace;
      }

      .seed { display: flex; align-items: center; gap: 8px; }
      .seed strong { color: var(--accent); font-weight: 600; }

      .control-grid { display: grid; gap: 10px; font: 11px/1.4 Menlo, Monaco, "Courier New", monospace; }

      label { display: grid; gap: 6px; }

      .slider-row { display: flex; align-items: center; gap: 8px; }
      input[type=range] { flex: 1; min-width: 0; }
      .val { min-width: 34px; color: var(--accent); text-align: right; }

      select {
        border: 1px solid var(--line); border-radius: 6px;
        background: #fbf8f0; color: var(--ink); font: inherit; padding: 6px 8px;
      }

      button {
        border: 1px solid var(--line); border-radius: 999px;
        padding: 7px 12px; background: rgba(255,252,245,0.95);
        color: var(--accent); font: 11px/1.2 Menlo, Monaco, "Courier New", monospace;
        cursor: pointer;
      }

      button:hover { background: #fff; }

      .checkbox-row { display: flex; align-items: center; gap: 8px; }

      #canvas-host {
        padding: 10px;
        display: grid;
        justify-content: center;
        width: 100%;
        overflow: hidden;
      }

      #canvas-host canvas {
        display: block;
        border-radius: 6px;
        max-width: 100%;
        max-height: min(78vh, 760px);
        height: auto !important;
      }

      @media (max-width: 820px) {
        .workspace { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="nav">
        <a href="../index.html">All tests</a>
        <span class="sep">·</span>
        <a href="../p5/pastel_hatching_test.html">← p5 version</a>
      </div>
      <h1>Pastel Hatching <small style="font-size:0.55em;color:#8a9aa8;">standalone</small></h1>
      <p>
        Three random circles drawn with brush.mass() from a fixed palette, reseeded on each render.
        Controls adjust brush type, precision, strength, gradient, and outline.
      </p>

      <div class="workspace">
        <div id="controls" class="panel">
          <div class="top-row">
            <div class="seed">
              <span>Seed</span>
              <strong id="seedVal">000000</strong>
            </div>
            <button id="refresh-seed" type="button">Refresh Seed</button>
          </div>

          <div class="control-grid">
            <label>
              Brush
              <select id="brushType">
                <option value="pastel">pastel</option>
                <option value="crayon">crayon</option>
                <option value="HB">HB</option>
                <option value="pen">pen</option>
              </select>
            </label>

            <label>
              Precision
              <div class="slider-row">
                <input type="range" id="precision" min="0" max="1" step="0.01" value="0.3" />
                <span class="val" id="precisionVal">0.3</span>
              </div>
            </label>

            <label>
              Strength
              <div class="slider-row">
                <input type="range" id="strength" min="0" max="1" step="0.01" value="0.6" />
                <span class="val" id="strengthVal">0.6</span>
              </div>
            </label>

            <label>
              Gradient
              <div class="slider-row">
                <input type="range" id="gradient" min="0" max="1" step="0.01" value="0.1" />
                <span class="val" id="gradientVal">0.1</span>
              </div>
            </label>

            <label class="checkbox-row">
              <input type="checkbox" id="outline" />
              Outline
            </label>

            <!-- experiment/gpu-dots branch: prototype mass styles (new build only) -->
            <label>
              Style
              <select id="style">
                <option value="arcs">Arcs (current)</option>
                <option value="scribble">Scribble</option>
              </select>
            </label>

            <label>
              Max length <small style="color:#8a9aa8;">(scribble, 0 = auto)</small>
              <div class="slider-row">
                <input type="range" id="length" min="0" max="200" step="1" value="0" />
                <span class="val" id="lengthVal">auto</span>
              </div>
            </label>

            <label>
              Follow edges
              <div class="slider-row">
                <input type="range" id="follow" min="0" max="1" step="0.01" value="0.25" />
                <span class="val" id="followVal">0.25</span>
              </div>
            </label>

            <!-- experiment/gpu-dots branch: compares dist/ (2.3.0) with dist-exp/ (npm run build:exp) -->
            <label id="dotsRow" hidden>
              Build <small style="color:#8a9aa8;">(press G to flip)</small>
              <select id="dots">
                <option value="cpu">2.3.0 · CPU dots (dist/)</option>
                <option value="gpu">New · GPU dots (dist-exp/)</option>
              </select>
            </label>
            <div id="renderTime" class="val" style="font-variant-numeric:tabular-nums;" hidden></div>
          </div>
        </div>

        <div id="canvas-host" class="panel"></div>
      </div>
    </main>

    <script src="./standalone_profiler.js"></script>
    <script type="module">
      // experiment/gpu-dots branch: when dist-exp/ exists, load it alongside
      // dist/ so the two builds can be compared live. Each module copy keeps
      // its own state and draws on its own canvas.
      const builds = { cpu: await import("../../dist/brush.esm.js") };
      try {
        builds.gpu = await import("../../dist-exp/brush.esm.js");
      } catch {}
      const hasGpuDots = !!builds.gpu;
      let brush = builds.cpu;

      const PAPER = "#fffceb";
      const PALETTE = ["#002185", "#003c32", "#fcd300", "#ff2702", "#6b9404"];
      const CW = 600, CH = 600;

      const pixelDensity = window.devicePixelRatio || 1;
      const canvases = {};
      for (const [mode, b] of Object.entries(builds)) {
        canvases[mode] = b.createCanvas(CW, CH, { id: `brush-canvas-${mode}`, parent: "#canvas-host", pixelDensity });
        b.scaleBrushes(3);
      }

      let currentSeed = Number(new URLSearchParams(location.search).get("seed")) || Math.floor(Math.random() * 900000) + 100000;

      const state = {
        brushType: "pastel",
        precision: 0.3,
        strength:  0.6,
        gradient:  0.1,
        outline:   false,
        style:     new URLSearchParams(location.search).get("style") ?? "arcs",
        follow:    0.25,
        length:    0,
        dots:      new URLSearchParams(location.search).get("dots") === "gpu" ? "gpu" : "cpu",
      };

      const controls = {
        seedVal:      document.getElementById("seedVal"),
        refreshSeed:  document.getElementById("refresh-seed"),
        brushType:    document.getElementById("brushType"),
        precision:    document.getElementById("precision"),
        precisionVal: document.getElementById("precisionVal"),
        strength:     document.getElementById("strength"),
        strengthVal:  document.getElementById("strengthVal"),
        gradient:     document.getElementById("gradient"),
        gradientVal:  document.getElementById("gradientVal"),
        outline:      document.getElementById("outline"),
        style:        document.getElementById("style"),
        followVal:    document.getElementById("followVal"),
        lengthVal:    document.getElementById("lengthVal"),
        dotsRow:      document.getElementById("dotsRow"),
        dots:         document.getElementById("dots"),
        renderTime:   document.getElementById("renderTime"),
      };
      if (hasGpuDots) {
        controls.dotsRow.hidden = false;
        controls.renderTime.hidden = false;
        controls.dots.value = state.dots;
      }

      // Mulberry32 seeded PRNG — mirrors p5's randomSeed behavior
      function mkRng(seed) {
        let s = seed >>> 0;
        return function () {
          s += 0x6d2b79f5;
          let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t ^= t + Math.imul(t ^ (t >>> 7), 61 | t);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function formatValue(v) {
        return Number.isInteger(v) ? String(v) : v.toFixed(2).replace(/0$/, "").replace(/\.$/, "");
      }

      function syncReadouts() {
        controls.seedVal.textContent = String(currentSeed).padStart(6, "0");
        controls.precisionVal.textContent = formatValue(state.precision);
        controls.strengthVal.textContent  = formatValue(state.strength);
        controls.gradientVal.textContent  = formatValue(state.gradient);
        controls.followVal.textContent    = formatValue(state.follow);
        controls.lengthVal.textContent    = state.length ? `${state.length}px` : "auto";
      }

      let renderQueued = false;
      function queueRender() {
        if (renderQueued) return;
        renderQueued = true;
        requestAnimationFrame(() => { renderQueued = false; renderScene(); });
      }

      function renderScene() {
        syncReadouts();
        const mode = hasGpuDots ? state.dots : "cpu";
        brush = builds[mode];
        for (const [m, c] of Object.entries(canvases)) c.style.display = m === mode ? "" : "none";
        const t0 = performance.now();

        const rng = mkRng(currentSeed);
        brush.seed(currentSeed);
        brush.noiseSeed(currentSeed);

        brush.clear(PAPER);
        brush.push();
        brush.translate(-CW / 2, -CH / 2);
        brush.wiggle();

        for (let i = 0; i < 3; i++) {
          const color = PALETTE[Math.floor(rng() * PALETTE.length)];
          const x = rng() * CW;
          const y = rng() * CH;
          const r = CW * (0.2 + rng() * 0.2);

          brush.mass(state.brushType, color, {
            precision: state.precision,
            strength:  state.strength,
            gradient:  state.gradient,
            outline:   state.outline,
            ...(state.style === "scribble"
              ? { style: "scribble", follow: state.follow, ...(state.length ? { length: state.length } : {}) }
              : {}),
          });
          brush.set("pen", "black", 1);
          brush.circle(x, y, r);
          brush.noMass();
        }

        brush.pop();
        brush.render();
        if (hasGpuDots) {
          const t1 = performance.now();
          // A 1×1 readback waits for queued GPU work, so the second figure includes it.
          const gl = canvases[mode].getContext("webgl2");
          gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(4));
          const t2 = performance.now();
          controls.renderTime.textContent =
            `${mode === "gpu" ? "New" : "2.3.0"}: ${(t1 - t0).toFixed(1)} ms CPU · ${(t2 - t0).toFixed(1)} ms incl. GPU`;
        }
        window.reportStandaloneFirstFrame?.("pastel_hatching_test");
      }

      function bindSlider(id, key) {
        document.getElementById(id).addEventListener("input", (e) => {
          state[key] = Number(e.target.value);
          syncReadouts();
          queueRender();
        });
      }

      bindSlider("precision", "precision");
      bindSlider("strength",  "strength");
      bindSlider("gradient",  "gradient");
      bindSlider("follow",    "follow");
      bindSlider("length",    "length");
      controls.style.value = state.style;
      controls.style.addEventListener("change", () => {
        state.style = controls.style.value;
        queueRender();
      });

      controls.brushType.addEventListener("change", () => {
        state.brushType = controls.brushType.value;
        queueRender();
      });

      controls.outline.addEventListener("change", () => {
        state.outline = controls.outline.checked;
        queueRender();
      });

      function setDots(mode) {
        state.dots = mode;
        controls.dots.value = mode;
        queueRender();
      }
      controls.dots.addEventListener("change", () => setDots(controls.dots.value));
      window.addEventListener("keydown", (e) => {
        if (!hasGpuDots || e.key.toLowerCase() !== "g" || e.target.matches("input, select")) return;
        setDots(state.dots === "gpu" ? "cpu" : "gpu");
      });

      controls.refreshSeed.addEventListener("click", () => {
        currentSeed = Math.floor(Math.random() * 900000) + 100000;
        queueRender();
      });

      renderScene();
    </script>
  <script src="../test-nav.js"></script>
  </body>
</html>
